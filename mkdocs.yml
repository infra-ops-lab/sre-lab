site_name: SRE Lab
site_description: A hands-on Site Reliability Engineering course for platform and DevOps engineers. SLOs, observability, alerting, incidents, troubleshooting, safe change, capacity, resilience and reliable platform design, with labs on kind.
site_url: https://infra-ops-lab.github.io/sre-lab/
repo_url: https://github.com/infra-ops-lab/sre-lab
repo_name: infra-ops-lab/sre-lab
edit_uri: edit/main/docs/

nav:
  - Home: index.md
  - Lab environment: setup.md
  - "0. Why SRE":
      - Lesson: 00-why-sre/index.md
      - Test yourself: 00-why-sre/test-yourself.md
  - "1. SLOs and error budgets":
      - Lesson: 01-slos/index.md
      - Lab: 01-slos/lab.md
      - Test yourself: 01-slos/test-yourself.md
  - "2. Observability":
      - Lesson: 02-observability/index.md
      - Lab: 02-observability/lab.md
      - Test yourself: 02-observability/test-yourself.md
  - "3. Alerting and on-call":
      - Lesson: 03-alerting/index.md
      - Lab: 03-alerting/lab.md
      - Runbook (example): 03-alerting/runbook-checkout.md
      - Test yourself: 03-alerting/test-yourself.md
  - "4. Incidents and postmortems":
      - Lesson: 04-incidents/index.md
      - Lab (game day): 04-incidents/lab.md
      - Postmortem template: 04-incidents/postmortem-template.md
      - Test yourself: 04-incidents/test-yourself.md
  - "5. Troubleshooting Kubernetes":
      - Lesson: 05-k8s-troubleshooting/index.md
      - Lab: 05-k8s-troubleshooting/lab.md
      - Test yourself: 05-k8s-troubleshooting/test-yourself.md
  - "6. Linux and network troubleshooting":
      - Lesson: 06-linux-network/index.md
      - Lab: 06-linux-network/lab.md
      - Test yourself: 06-linux-network/test-yourself.md
  - "7. Safe change":
      - Lesson: 07-safe-change/index.md
      - Lab: 07-safe-change/lab.md
      - Test yourself: 07-safe-change/test-yourself.md
  - Coming next: roadmap.md

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle: { icon: material/weather-night, name: Dark mode }
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle: { icon: material/weather-sunny, name: Light mode }
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
    - navigation.instant
    - search.highlight
    - toc.follow

markdown_extensions:
  - tables
  - attr_list
  - md_in_html
  - footnotes
  - toc: { permalink: true }
  - admonition
  - pymdownx.details
  - pymdownx.highlight: { anchor_linenums: true }
  - pymdownx.inlinehilite
  - pymdownx.tasklist: { custom_checkbox: true }
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
