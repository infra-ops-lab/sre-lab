# Two fake "notification channels": every alert notification they receive is printed to the pod log.
#   kubectl -n monitoring logs deploy/pager -f      (what would wake someone up)
#   kubectl -n monitoring logs deploy/tickets -f    (what goes to the team's queue)
apiVersion: apps/v1
kind: Deployment
metadata: { name: pager, namespace: monitoring }
spec:
  selector: { matchLabels: { app: pager } }
  template:
    metadata: { labels: { app: pager } }
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:38
          env: [{ name: HTTP_PORT, value: "8080" }, { name: LOG_WITHOUT_NEWLINE, value: "true" }]
---
apiVersion: v1
kind: Service
metadata: { name: pager, namespace: monitoring }
spec: { selector: { app: pager }, ports: [{ port: 8080 }] }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: tickets, namespace: monitoring }
spec:
  selector: { matchLabels: { app: tickets } }
  template:
    metadata: { labels: { app: tickets } }
    spec:
      containers:
        - name: echo
          image: mendhak/http-https-echo:38
          env: [{ name: HTTP_PORT, value: "8080" }, { name: LOG_WITHOUT_NEWLINE, value: "true" }]
---
apiVersion: v1
kind: Service
metadata: { name: tickets, namespace: monitoring }
spec: { selector: { app: tickets }, ports: [{ port: 8080 }] }
