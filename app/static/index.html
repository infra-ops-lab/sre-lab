<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SRE Practice Lab</title>
<link rel="stylesheet" href="/style.css">
<script>window.LAB_TOKEN = "{{TOKEN}}";</script>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="title">SRE Practice Lab</div>
    <div class="sub" id="countdown"></div>
  </div>
  <div class="fleet" id="fleet"></div>
  <div class="actions"><button class="btn ghost" id="toggleLog" hidden>Log</button></div>
</header>
<nav class="tabs" id="tabs">
  <button data-tab="plan" class="on">Plan</button>
  <button data-tab="qa">Q&amp;A drill</button>
  <button data-tab="interview">🎤 Interview me</button>
  <button data-tab="mock">Mock rounds</button>
  <button data-tab="stories">Stories</button>
  <button data-tab="jd">Target roles</button>
  <button data-tab="progress">Progress</button>
  <button data-tab="setup">Help</button>
</nav>
<main id="view"></main>
<aside class="log" id="log" hidden>
  <div class="log-head"><b id="logTitle">Job log</b><button class="btn ghost small" id="closeLog">Close</button></div>
  <pre id="logBody"></pre>
</aside>
<script>window.LABS = [];</script>
<script src="/private/jd.js"></script>
<script src="/private/personal.js"></script>
<script src="/content/mock.js"></script>
<script src="/content/plan.js"></script>
<script src="/app.js"></script>
</body>
</html>
